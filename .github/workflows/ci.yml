name: CI

on:
  push:
  pull_request:

# NOTE:
# if changing python versions, also update versions in
# - release.yml
# - noxfile.py

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}

    strategy:
      # without this a failure on an exploratory free-threaded build cancels
      # the supported cells, which then never upload coverage
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.15", "3.15t"]

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0

      # Setup env
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
            python-version: "${{ matrix.python-version }}"

      # nox is invoked with --force-python python, so it takes whatever is on
      # PATH. A GIL-enabled build there would pass silently as a duplicate of
      # the same version's GIL cell rather than testing anything new.
      - name: "Confirm the interpreter is free-threaded"
        if: endsWith(matrix.python-version, 't')
        shell: bash
        run: python -c "import sys; print(sys.version); assert not sys._is_gil_enabled()"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install MPI (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: "Run nox for ${{ matrix.python-version }}"
        shell: bash
        run: |
          lname="snx-${{matrix.os}}-${{matrix.python-version}}.lcov"
          xname="snx-${{matrix.os}}-${{matrix.python-version}}.xml"
          cov="lcov -o$lname xml -o$xname"
          uv run --group dev nox --force-python python -s testcov -- $cov

      - name: Coveralls Parallel
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        env:
          # macOS installs the coverage-reporter via a third-party Homebrew
          # tap; Homebrew's new tap-trust enforcement refuses it otherwise.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        with:
          parallel: true
          github-token: ${{ secrets.github_token }}
          flag-name: run-${{matrix.python-version}}-${{matrix.os}}
          file: "snx-${{matrix.os}}-${{matrix.python-version}}.lcov"

  type_check:
    name: Type Check
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
            python-version: "${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: "Run Type Checking for ${{ matrix.python-version }}"
        run: |
          uv run --group dev nox --force-python python -s type_check

  finish:
    name: "Finish Coveralls"
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true