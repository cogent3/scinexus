name: Release

on: [workflow_dispatch]

jobs:
  test:
    name: "Test on Python ${{ matrix.python-version }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      # without this a failure on an exploratory free-threaded build cancels
      # the supported cells, hiding whether they would have passed
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0

      # Setup env
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
            python-version: "${{ matrix.python-version }}"

      # nox is invoked with --force-python python, so it takes whatever is on
      # PATH. A GIL-enabled build there would pass silently as a duplicate of
      # the same version's GIL cell rather than testing anything new.
      - name: "Confirm the interpreter is free-threaded"
        if: endsWith(matrix.python-version, 't')
        shell: bash
        run: python -c "import sys; print(sys.version); assert not sys._is_gil_enabled()"

      - name: Install MPI (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: "Run nox for ${{ matrix.python-version }}"
        shell: bash
        run: |
          uv run --group dev nox -db uv --force-python python -s test
          uv run --group dev nox -db uv --force-python python -s test_types

      # the doc group pins cogent3[extra], which pulls kaleido and so orjson,
      # and orjson publishes no free-threaded wheels
      - name: "Run doc tests for ${{ matrix.python-version }}"
        if: ${{ !endsWith(matrix.python-version, 't') }}
        shell: bash
        run: |
          uv run --group dev nox -db uv --force-python python -s test_docs

      - name: "Run MPI tests"
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          uv run --group dev nox -db uv --force-python python -s testmpi

  docbuild:
    name: "Test the docs"
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0

      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
            python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: "test the docs code"
        run: |
          uv run --group dev nox -s cogdocs
          uv run --group dev --group doc zensical build

  build:
    name: Build wheel and sdist
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload sdist and wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snx-wheel-sdist
          path: |
            ./dist/*.whl
            ./dist/*.tar.gz

  release_test:
    name: Release to Test PyPI
    needs: [build, docbuild]
    environment: release_test
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdist and wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snx-wheel-sdist
          path: ./dist

      - name: Publish package distributions to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  release:
    name: Release to PyPI
    needs: release_test
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdist and wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snx-wheel-sdist
          path: ./dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
