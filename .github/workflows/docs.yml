name: Build Docs

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'skills/**'
      - 'scripts/publish_skills.py'
      - '.readthedocs.yaml'
      - 'zensical.toml'
      - 'rtd_get_docs.py'

permissions:
  contents: read

jobs:
  build-docs:
    if: github.repository == 'cogent3/SciNexus'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
            python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build Documentation
        run: |
          # update executable components
          uv run --group dev nox -s cogdocs
          # build actual docs
          uv run --group dev --group doc zensical build --clean
          # agent skills, which zensical cannot place: it does not copy a
          # hidden directory out of docs/
          uv run python scripts/publish_skills.py site
        working-directory: ${{ github.workspace }}

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scinexus-docs-html
          path: site
          # without this the .well-known directory is dropped from the
          # artifact and every published skill URL becomes a 404
          include-hidden-files: true

  trigger_rtd:
    if: github.repository == 'cogent3/SciNexus'
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Trigger Read the Docs build
        env:
          RTDS_WEBHOOK_URL: ${{ secrets.RTDS_WEBHOOK_URL }}
          RTDS_WEBHOOK_TOKEN: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -sS --fail-with-body -X POST \
            --data-urlencode "token=${RTDS_WEBHOOK_TOKEN}" \
            --data-urlencode "branches=${BRANCH}" \
            "${RTDS_WEBHOOK_URL}"
