name: Build Docs

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - 'zensical.toml'
      - 'rtd_get_docs.py'

permissions:
  contents: read

jobs:
  build-docs:
    if: github.repository == 'cogent3/SciNexus'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
        with:
            python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build Documentation
        run: |
          # update executable components
          uv run --group dev nox -s cogdocs
          # build actual docs
          uv run --group dev zensical build --clean
        working-directory: ${{ github.workspace }}

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scinexus-docs-html
          path: site

  trigger_rtd:
    if: github.repository == 'cogent3/SciNexus'
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Trigger Read the Docs build
        env:
          RTDS_WEBHOOK_URL: ${{ secrets.RTDS_WEBHOOK_URL }}
          RTDS_WEBHOOK_TOKEN: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -sS --fail-with-body -X POST \
            --data-urlencode "token=${RTDS_WEBHOOK_TOKEN}" \
            --data-urlencode "branches=${BRANCH}" \
            "${RTDS_WEBHOOK_URL}"
