name: Lint code using ruff

on:
  push:
  pull_request:

jobs:
  linters:
    runs-on: ubuntu-latest
    if: github.repository != 'cogent3/SciNexus'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Format code using ruff
        run: uv run --group dev nox -s fmt

      - name: Commit changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          author_name: ${{ github.actor }}
          author_email: ${{ github.actor }}@users.noreply.github.com
          message: "STY: pre-commit linting with ruff"
          add: "."
